name: Frontend Continuous Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "starter/frontend/**"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: frontend
  EKS_CLUSTER_NAME: cluster

defaults:
  run:
    working-directory: starter/frontend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: CI=true npm test

  build_and_push:
    runs-on: ubuntu-latest
    needs: [lint, test]
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The production frontend must talk to the deployed backend, never to
      # localhost. This value is supplied via a GitHub Repository Variable
      # (Settings -> Secrets and variables -> Actions -> Variables) named
      # REACT_APP_MOVIE_API_URL and must be set to the backend's reachable
      # LoadBalancer URL (see backend-cd.yaml) before this workflow can build
      # a working production image. We deliberately fail fast instead of
      # silently falling back to localhost.
      - name: Validate production backend URL is configured
        run: |
          if [ -z "${{ vars.REACT_APP_MOVIE_API_URL }}" ]; then
            echo "::error::Repository variable REACT_APP_MOVIE_API_URL is not set. Deploy the backend first, retrieve its LoadBalancer URL, and set this repository variable before running Frontend CD."
            exit 1
          fi

      - name: Set image tag
        id: vars
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
          REACT_APP_MOVIE_API_URL: ${{ vars.REACT_APP_MOVIE_API_URL }}
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL=$REACT_APP_MOVIE_API_URL \
            --tag=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Deploy to EKS
        working-directory: starter/frontend/k8s
        env:
          ECR_REGISTRY: ${{ needs.build_and_push.outputs.ecr_registry }}
          IMAGE_TAG: ${{ needs.build_and_push.outputs.image_tag }}
        run: |
          kustomize edit set image frontend=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          kustomize build | kubectl apply -f -

      - name: Wait for rollout
        run: kubectl rollout status deployment/frontend --timeout=180s

      - name: Show deployment status
        if: always()
        run: |
          kubectl get pods -l app=frontend
          kubectl get service frontend

      - name: Print frontend LoadBalancer URL to summary
        if: success()
        run: |
          echo "### Frontend Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ${{ needs.build_and_push.outputs.ecr_registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.build_and_push.outputs.image_tag }}" >> "$GITHUB_STEP_SUMMARY"
          HOSTNAME=$(kubectl get service frontend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
          if [ -n "$HOSTNAME" ]; then
            echo "Frontend URL: http://$HOSTNAME" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "LoadBalancer hostname not yet assigned. Run: kubectl get service frontend" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report failure
        if: failure()
        run: echo "::error::Frontend deployment failed. Check the logs above for the failing step (build, push, kubeconfig, kustomize, apply, or rollout)."
